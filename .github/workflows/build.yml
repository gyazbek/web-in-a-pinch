name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Finish the other platforms when one fails, to see all failures at once
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            executable: wip
            artifact_name: wip-linux-x64
          - os: windows-latest
            executable: wip.exe
            artifact_name: wip-windows-x64
          - os: macos-latest
            executable: wip
            artifact_name: wip-macos-arm64

    steps:
    - uses: actions/checkout@v7

    - name: Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        gcc -Wall -Wextra -std=c99 -O2 -pthread -o ${{ matrix.executable }} wip.c
        strip ${{ matrix.executable }}

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        gcc -Wall -Wextra -std=c99 -O2 -o ${{ matrix.executable }} wip.c -lws2_32
        strip ${{ matrix.executable }}

    - name: Test executable help
      run: |
        ./${{ matrix.executable }} --help

    - name: Smoke tests
      shell: bash
      run: bash tests/smoke.sh ./${{ matrix.executable }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.executable }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install clang and libFuzzer
      run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev

    - name: Fuzz for two minutes per target
      run: bash tests/fuzz.sh 120

    - name: Upload crash inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-crashes
        path: |
          fuzz-out/crashes
          fuzz-out/*.log

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8

    # The Linux and macOS binaries are both called "wip", so give each a distinct release name
    - name: Name release files by platform
      run: |
        mkdir dist
        cp wip-linux-x64/wip dist/wip-linux-x64
        cp wip-macos-arm64/wip dist/wip-macos-arm64
        cp wip-windows-x64/wip.exe dist/wip-windows-x64.exe
        chmod +x dist/wip-linux-x64 dist/wip-macos-arm64

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body: |
          Prebuilt binaries for Linux (x64), macOS (Apple Silicon) and Windows (x64).
          On Linux and macOS, rename the file to `wip` if you like and run `chmod +x` on it.
          See the README for usage and CHANGELOG.md for what changed.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
